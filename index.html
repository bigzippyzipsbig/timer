<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Timer</title>
  <meta name="description" content="A big, simple circular countdown timer.">
  <meta name="theme-color" content="#f5efe6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23ebe1d1' stroke-width='12'/%3E%3Cpath d='M50 10 A40 40 0 1 1 15.4 70' fill='none' stroke='%23e0643a' stroke-width='12' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>Timer</div>
    <div class="tools">
      <button id="soundBtn" class="icon-btn" aria-label="Toggle sound" aria-pressed="true" title="Sound (M)">
        <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="fsBtn" class="icon-btn" aria-label="Toggle fullscreen" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="dial" id="dial">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <g id="ticks"></g>
        <circle class="track" cx="50" cy="50" r="44"/>
        <circle class="progress" id="progress" cx="50" cy="50" r="44" transform="rotate(-90 50 50)"/>
        <circle class="head" id="head" cx="50" cy="6" r="2.2"/>
      </svg>

      <div class="face">
        <button id="timeBtn" class="time" title="Click to type a time">45:00</button>
        <div id="timeEdit" class="time-edit" hidden>
          <div id="timeMask" class="time-mask" aria-hidden="true"></div>
          <input id="timeInput" class="time-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" spellcheck="false" aria-label="Set time: type digits, filled in from the right as seconds, minutes, hours">
        </div>
        <div id="sub" class="sub">45 minute timer</div>
        <div class="bumps">
          <button class="chip" data-add="30">+0:30</button>
          <button class="chip" data-add="60">+1:00</button>
          <button class="chip" data-add="300">+5:00</button>
        </div>
      </div>
    </div>

    <nav class="presets" id="presets" aria-label="Presets"></nav>
  </main>

  <footer class="controls">
    <button id="startBtn" class="btn primary">
      <svg id="icoPlay" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
      <svg id="icoPause" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" hidden><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
      <span id="startLabel">Start</span>
    </button>
    <button id="resetBtn" class="btn ghost">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Reset</span>
    </button>
  </footer>
  <p></p>
  <script src="script.js"></script>
</body>
</html>
